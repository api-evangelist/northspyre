name: Northspyre
description: >-
  Northspyre is a real estate development management platform that gives owners,
  developers, and project teams an end-to-end system for managing deals, projects,
  and portfolios across the full development lifecycle — acquisition, early planning,
  pre-development, construction, and stabilization. It unifies siloed project data
  and automates routine work with tools for financial modeling and deal pipeline
  management, budget and cost control, vendor procurement and management, forecasting,
  portfolio analytics, and investor and lender reporting. Northspyre is delivered as a
  hosted SaaS application and is SOC 2 Type II certified. It exposes no public developer
  API surface at this time; this profile captures the company's public identity,
  compliance posture, and domain security.
